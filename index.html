<section class="tela" id="jogoTela">
  <div class="container">
    <h2>🎮 Um Dia no Escritório</h2>
    <p>Organize documentos, atenda clientes e conclua seu expediente antes do tempo acabar!</p>

    <div style="background:#102b42;padding:20px;border-radius:20px;margin:20px auto;max-width:900px">
      <p>
        📄 Documentos: <b id="docs">0/4</b> |
        🤝 Clientes: <b id="clientes">0/2</b> |
        ⭐ Pontos: <b id="score">0</b> |
        ⏱️ Tempo: <b id="tempo">90</b>s
      </p>

      <canvas id="game" width="800" height="480"
        style="width:100%;height:auto;background:#eaf2e8;border-radius:12px;display:block;margin:20px auto;touch-action:none">
      </canvas>

      <p id="mensagem">Clique em iniciar para começar!</p>

      <button class="btn" onclick="iniciarJogo()">▶ INICIAR JOGO</button>
      <button class="btn" onclick="mostrarTela('menuTela')">⬅ VOLTAR AO MENU</button>

      <div style="margin-top:15px">
        <button class="btn" onpointerdown="teclas.cima=true" onpointerup="teclas.cima=false" onpointerleave="teclas.cima=false">▲</button><br>
        <button class="btn" onpointerdown="teclas.esquerda=true" onpointerup="teclas.esquerda=false" onpointerleave="teclas.esquerda=false">◀</button>
        <button class="btn" onpointerdown="teclas.baixo=true" onpointerup="teclas.baixo=false" onpointerleave="teclas.baixo=false">▼</button>
        <button class="btn" onpointerdown="teclas.direita=true" onpointerup="teclas.direita=false" onpointerleave="teclas.direita=false">▶</button>
      </div>
    </div>
  </div>
</section>

  jogoAtivo = true;
  ultimoTempo = performance.now();

  document.getElementById("mensagem").textContent =
    "Missão iniciada! Recolha os documentos e aproxime-se dos clientes.";
  loopJogo = requestAnimationFrame(atualizarJogo);
}
