* {

}

:root {

}

body {

button {

}

}

.btn:hover {
    transform: translateY(-3px);

    font-size: 20px;
}

    z-index: 100;

    color: #132b49;
    border-radius: 14px;
    padding: 12px 17px;

    box-shadow: 0 8px 28px rgba(0,0,0,.2);
}

.avatares {

}

.avatar {

    border: 2px solid transparent;
    box-shadow: 0 10px 25px rgba(0,0,0,.12);
    transition: .2s;
}

.avatar:hover {
    transform: translateY(-4px);
}

.avatar.selecionado {

    box-shadow: 0 0 0 3px rgba(232,189,88,.22);
}

.avatar .emoji {

    display: block;
    margin-bottom: 10px;
