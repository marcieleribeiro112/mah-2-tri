<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profissional Nota 10</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#07152e,#123b75,#0b6fa4);
    color:white;
}

button{cursor:pointer;border:none}

.tela{
    display:none;
    min-height:100vh;
    padding:30px 20px;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.tela.ativa{display:flex}

.container{
    width:100%;
    max-width:1000px;
}

h1{font-size:50px;margin-bottom:20px}
h2{font-size:34px;margin-bottom:20px}
h3{margin-bottom:15px}
p{font-size:18px;line-height:1.6}

.btn{
    background:#ffd21c;
    color:#111827;
    padding:15px 28px;
    border-radius:14px;
    font-size:18px;
    font-weight:bold;
    margin:8px;
    transition:.2s;
}

.btn:hover{transform:scale(1.05)}

.avatar-principal{font-size:100px;margin-bottom:15px}

.pontuacao{
    position:fixed;
    top:15px;
    right:15px;
    z-index:100;
    background:#ffd21c;
    color:#111827;
    padding:12px 20px;
    border-radius:30px;
    font-weight:bold;
}

.avatares{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin:30px 0;
}

.avatar{
    background:white;
    color:#111827;
    padding:25px;
    border-radius:20px;
    transition:.2s;
}

.avatar:hover{transform:translateY(-5px)}
.avatar.selecionado{outline:5px solid #ffd21c}

.avatar .emoji{
    font-size:60px;
    display:block;
    margin-bottom:10px;
}

.menu{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
    margin:30px 0;
}

.card{
    background:rgba(255,255,255,.12);
    padding:15px;
    border-radius:20px;
    backdrop-filter:blur(8px);
}

.card button{
    width:100%;
    padding:25px;
    border-radius:15px;
    font-size:18px;
    font-weight:bold;
    background:white;
    color:#111827;
}

.icone{
    display:block;
    font-size:40px;
    margin-bottom:10px;
}

.fala{
    background:white;
    color:#111827;
    padding:20px;
    border-radius:18px;
    margin:20px auto;
    max-width:750px;
    font-size:18px;
}

.opcoes{
    display:grid;
    gap:12px;
    margin:25px auto;
    max-width:750px;
}

.opcao{
    background:white;
    color:#111827;
    padding:18px;
    border-radius:12px;
    text-align:left;
    font-size:17px;
}

.opcao:hover{background:#ffd21c}

.feedback{
    display:none;
    padding:20px;
    border-radius:15px;
    background:rgba(255,255,255,.15);
    margin:20px;
}

.progresso{
    width:100%;
    height:14px;
    background:rgba(255,255,255,.2);
    border-radius:20px;
    overflow:hidden;
    margin:20px 0;
}

.barra{
    width:0%;
    height:100%;
    background:#ffd21c;
    transition:.5s;
}

/* VÍDEOS */
.video-box{
    background:rgba(255,255,255,.12);
    padding:25px;
    border-radius:22px;
    margin:25px 0;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
}

.video{
    position:relative;
    width:100%;
    max-width:800px;
    height:380px;
    margin:20px auto;
    overflow:hidden;
    border-radius:20px;
    background:linear-gradient(135deg,#111827,#243b64);
    border:3px solid rgba(255,255,255,.2);
}

.cenario{
    position:absolute;
    inset:0;
    overflow:hidden;
}

.chao{
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
    height:80px;
    background:#263238;
}

.personagem{
    position:absolute;
    bottom:75px;
    font-size:80px;
    transition:all 1s ease;
}

.personagem.um{left:15%}
